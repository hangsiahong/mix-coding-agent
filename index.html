<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mix — the minimal coding agent</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: '#08080f',
        elevated: '#0d0d1a',
        accent: '#00ffaa',
        'accent-blue': '#00bbff',
        'accent-pink': '#ff3a6e',
        dim: '#4a4a6a',
        muted: '#8888a8',
      },
      fontFamily: {
        mono: ['JetBrains Mono', 'Fira Code', 'SF Mono', 'Menlo', 'monospace'],
      }
    }
  }
}
</script>
<style>
  /* Scan line */
  .term-glow::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 30%;
    background: linear-gradient(180deg, transparent, rgba(0,255,170,0.02), transparent);
    animation: scan 4s linear infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes scan {
    0%   { top: -100%; }
    100% { top: 200%; }
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 60px rgba(0,255,170,0.06), 0 8px 48px rgba(0,0,0,0.5); }
    50%      { box-shadow: 0 0 100px rgba(0,255,170,0.1), 0 8px 48px rgba(0,0,0,0.5); }
  }
  .animate-fade-up {
    animation: fadeUp 0.8s ease both;
  }
  .delay-100 { animation-delay: 0.1s; }
  .delay-200 { animation-delay: 0.2s; }
  .delay-300 { animation-delay: 0.3s; }
  .delay-500 { animation-delay: 0.5s; }
  .delay-700 { animation-delay: 0.7s; }
  .cursor-el {
    display: inline-block;
    width: 9px;
    height: 1.2em;
    background: #00ffaa;
    vertical-align: text-bottom;
    animation: blink 0.7s step-end infinite;
    box-shadow: 0 0 10px rgba(0,255,170,0.5);
    border-radius: 1px;
  }
  .term-body .prompt { color: #00ffaa; }
  .term-body .cmd    { color: #e8e8f8; }
  .term-body .out    { color: #5a5a7a; display: block; white-space: pre-wrap; margin: 0.1rem 0; }
  /* Background grid */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image:
      linear-gradient(rgba(0,255,170,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,170,0.08) 1px, transparent 1px);
    background-size: 72px 72px;
    z-index: 0;
  }
</style>
</head>
<body class="bg-bg text-white font-mono antialiased overflow-x-hidden">

<!-- ═══ Single Section: Hero + Terminal ═══ -->
<section class="relative min-h-screen flex flex-col items-center justify-center px-4 z-10">

  <!-- Ambient glow blob -->
  <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full bg-accent/5 blur-[120px] pointer-events-none"></div>

  <!-- Logo -->
  <h1 class="animate-fade-up text-[clamp(5rem,15vw,11rem)] font-black tracking-tighter leading-none select-none"
      style="background: linear-gradient(135deg, #00ffaa 0%, #00bbff 45%, #ff3a6e 100%); background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: fadeUp 0.8s ease both, gradientShift 6s ease infinite;">
    mix
  </h1>

  <!-- Tagline -->
  <p class="animate-fade-up delay-100 text-dim text-[clamp(0.7rem,2vw,1rem)] uppercase tracking-[0.2em] mt-3">
    the minimal coding agent · v0.3
  </p>

  <!-- Subtitle -->
  <p class="animate-fade-up delay-200 text-accent text-[clamp(0.7rem,1.5vw,0.9rem)] mt-4 tabular-nums">
    ~1.3k lines of bash<span class="inline-block border-r-2 border-accent pr-1 ml-0.5" style="animation: blink 0.7s step-end infinite;">&nbsp;</span>
  </p>

  <!-- Terminal -->
  <div class="animate-fade-up delay-500 w-full max-w-[680px] mt-10">
    <div class="term-glow relative rounded-2xl border border-white/[0.07] bg-elevated overflow-hidden transition-all duration-500 hover:border-accent/20"
         style="animation: pulse-glow 4s ease infinite;">
      <!-- Title bar -->
      <div class="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-b from-[#151530] to-[#0e0e20] border-b border-white/[0.07]">
        <span class="w-3 h-3 rounded-full bg-[#ff5f57] shadow-[0_0_6px_rgba(255,95,87,0.5)]"></span>
        <span class="w-3 h-3 rounded-full bg-[#ffbd2e] shadow-[0_0_6px_rgba(255,189,46,0.5)]"></span>
        <span class="w-3 h-3 rounded-full bg-[#28ca42] shadow-[0_0_6px_rgba(40,202,66,0.5)]"></span>
        <span class="ml-auto text-dim text-[0.6rem] tracking-widest">mix — bash</span>
      </div>
      <!-- Body -->
      <div class="term-body p-5 text-[0.78rem] min-h-[200px] text-[#7a7a9a] leading-[1.9] relative z-[3]" id="termBody"></div>
    </div>
  </div>

  <!-- Stats row -->
  <div class="animate-fade-up delay-700 flex flex-wrap justify-center gap-8 mt-12 text-center">
    <div class="group cursor-default">
      <div class="text-2xl font-black bg-gradient-to-br from-accent to-accent-blue bg-clip-text text-transparent">~1.3K</div>
      <div class="text-dim text-[0.6rem] uppercase tracking-[0.15em] mt-1">Lines of Code</div>
    </div>
    <div class="group cursor-default">
      <div class="text-2xl font-black bg-gradient-to-br from-accent to-accent-blue bg-clip-text text-transparent">3</div>
      <div class="text-dim text-[0.6rem] uppercase tracking-[0.15em] mt-1">Dependencies</div>
    </div>
    <div class="group cursor-default">
      <div class="text-2xl font-black bg-gradient-to-br from-accent to-accent-blue bg-clip-text text-transparent">0</div>
      <div class="text-dim text-[0.6rem] uppercase tracking-[0.15em] mt-1">npm Packages</div>
    </div>
    <div class="group cursor-default">
      <div class="text-2xl font-black bg-gradient-to-br from-accent to-accent-pink bg-clip-text text-transparent">100%</div>
      <div class="text-dim text-[0.6rem] uppercase tracking-[0.15em] mt-1">You Own</div>
    </div>
  </div>

</section>

<!-- ═══ Footer ═══ -->
<footer class="relative z-10 text-center py-8 text-dim text-[0.65rem] tracking-wider border-t border-white/[0.07]">
  built with <span class="text-accent">bash</span> and stubbornness · <span class="text-accent">mix</span> © 2025
</footer>

<!-- ═══ Scripts ═══ -->
<script>
// Terminal typewriter
(function() {
  const el = document.getElementById('termBody');

  const lines = [
    { type: 'row', parts: [
      { cls: 'prompt', text: '$ ' },
      { cls: 'cmd', text: 'wc -l mix' }
    ]},
    { type: 'out', text: '1259 mix' },
    { type: 'row', parts: [
      { cls: 'prompt', text: '$ ' },
      { cls: 'cmd', text: './mix "fix the auth middleware"' }
    ]},
    { type: 'out', text: '▸ streaming tokens... ▸ reading src/auth.js... ▸ patch applied ✓' },
    { type: 'out', text: '▸ risk: LOW → auto-run ▸ git committed' },
    { type: 'row', parts: [
      { cls: 'prompt', text: '$ ' },
      { cls: 'cmd', text: './mix "add rate limiting"' }
    ]},
    { type: 'out', text: '▸ streaming tokens... ▸ writing rate_limit.py... ▸ tests pass ✓' },
    { type: 'out', text: '▸ risk: MED → sudo apt install → [Y/n] Y ▸ filed to memorybank/' },
    { type: 'row', parts: [
      { cls: 'prompt', text: '$ ' },
      { cls: 'cmd', text: 'echo "that''s it. that''s the agent."' }
    ]},
    { type: 'out', text: "that's it. that's the agent." },
    { type: 'cursor-row', parts: [
      { cls: 'prompt', text: '$ ' }
    ]}
  ];

  let lineIdx = 0;
  let charIdx = 0;
  let currentCmdSpan = null;

  function type() {
    if (lineIdx >= lines.length) return;
    const line = lines[lineIdx];

    if (charIdx === 0) {
      const wrap = document.createElement('div');
      wrap.style.minHeight = '1.6em';

      if (line.type === 'out') {
        const span = document.createElement('span');
        span.className = 'out';
        span.textContent = line.text;
        wrap.appendChild(span);
        el.appendChild(wrap);
        el.scrollTop = el.scrollHeight;
        charIdx = 0;
        lineIdx++;
        setTimeout(type, 200);
        return;
      }

      for (const part of line.parts) {
        const span = document.createElement('span');
        span.className = part.cls;
        span.textContent = part.text;
        wrap.appendChild(span);
        if (part.cls === 'cmd') currentCmdSpan = span;
      }

      if (line.type === 'cursor-row') {
        const cur = document.createElement('span');
        cur.className = 'cursor-el';
        wrap.appendChild(cur);
      }

      el.appendChild(wrap);
      el.scrollTop = el.scrollHeight;

      if (currentCmdSpan && line.type === 'row') {
        currentCmdSpan.textContent = '';
        charIdx = 0;
        typeChar();
        return;
      }

      charIdx = 0;
      lineIdx++;
      setTimeout(type, 300);
      return;
    }
  }

  function typeChar() {
    if (lineIdx >= lines.length) return;
    const line = lines[lineIdx];
    const cmdPart = line.parts.find(p => p.cls === 'cmd');
    if (!cmdPart || !currentCmdSpan) { lineIdx++; charIdx = 0; setTimeout(type, 200); return; }

    if (charIdx < cmdPart.text.length) {
      currentCmdSpan.textContent += cmdPart.text[charIdx];
      charIdx++;
      el.scrollTop = el.scrollHeight;
      setTimeout(typeChar, 25 + Math.random() * 35);
    } else {
      currentCmdSpan = null;
      charIdx = 0;
      lineIdx++;
      setTimeout(type, 350);
    }
  }

  setTimeout(type, 1400);
})();
</script>

</body>
</html>
